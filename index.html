<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/assets/logoChita.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- theme-color = --color-verde-oscuro (--brand) (src/index.css) -->
    <meta name="theme-color" content="#016B29" />
    <meta name="description" content="Intercolonias Chita: resultados en vivo, tablas, llaves y goleadores." />
